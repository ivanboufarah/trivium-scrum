<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" font-family="Open Sans, Arial, Helvetica, sans-serif"><title>Modelo en V</title><desc>A la izquierda las fases de diseño, abajo la codificación y a la derecha las pruebas que verifican cada fase.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#222344"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><text x="450" y="34" text-anchor="middle" font-size="22" fill="#222344" font-weight="700">Modelo en V</text><text x="115" y="56" text-anchor="middle" font-size="14" fill="#222344" font-weight="700">Desarrollo</text><text x="785" y="56" text-anchor="middle" font-size="14" fill="#222344" font-weight="700">Verificación y validación</text><rect x="20" y="66" width="190" height="52" rx="8" fill="#cdad7d"/><text x="115.0" y="97" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Requisitos</text><rect x="690" y="66" width="190" height="52" rx="8" fill="#e6d3a8"/><text x="785.0" y="88" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Pruebas de</text><text x="785.0" y="107" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">aceptación</text><path d="M214 92 H686" fill="none" stroke="#222344" stroke-width="2" stroke-dasharray="6 5"/><rect x="90" y="130" width="190" height="52" rx="8" fill="#cdad7d"/><text x="185.0" y="152" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Diseño del</text><text x="185.0" y="171" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">sistema</text><rect x="620" y="130" width="190" height="52" rx="8" fill="#e6d3a8"/><text x="715.0" y="152" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Pruebas de</text><text x="715.0" y="171" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">sistema</text><path d="M284 156 H616" fill="none" stroke="#222344" stroke-width="2" stroke-dasharray="6 5"/><rect x="160" y="194" width="190" height="52" rx="8" fill="#cdad7d"/><text x="255.0" y="216" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Diseño de</text><text x="255.0" y="235" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">arquitectura</text><rect x="550" y="194" width="190" height="52" rx="8" fill="#e6d3a8"/><text x="645.0" y="216" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Pruebas de</text><text x="645.0" y="235" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">integración</text><path d="M354 220 H546" fill="none" stroke="#222344" stroke-width="2" stroke-dasharray="6 5"/><rect x="230" y="258" width="190" height="52" rx="8" fill="#cdad7d"/><text x="325.0" y="280" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Diseño</text><text x="325.0" y="299" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">detallado</text><rect x="480" y="258" width="190" height="52" rx="8" fill="#e6d3a8"/><text x="575.0" y="280" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Pruebas</text><text x="575.0" y="299" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">unitarias</text><path d="M424 284 H476" fill="none" stroke="#222344" stroke-width="2" stroke-dasharray="6 5"/><rect x="340" y="332" width="220" height="46" rx="8" fill="#f4efdd" stroke="#222344" stroke-width="2"/><text x="450.0" y="361" text-anchor="middle" font-size="16" fill="#222344" font-weight="700">Codificación</text><path d="M230 318 L338 350" fill="none" stroke="#222344" stroke-width="2" marker-end="url(#a)"/><path d="M562 350 L670 318" fill="none" stroke="#222344" stroke-width="2"/><text x="450" y="406" text-anchor="middle" font-size="14" fill="#222344" font-weight="400">Cada fase de desarrollo se corresponde con una fase de prueba</text></svg>