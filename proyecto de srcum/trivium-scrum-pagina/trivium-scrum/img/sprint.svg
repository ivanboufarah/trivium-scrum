<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" font-family="Open Sans, Arial, Helvetica, sans-serif"><title>Ciclo del Sprint de Scrum</title><desc>Planificación del Sprint, Scrum diario, revisión y retrospectiva alrededor de la meta del Sprint; el producto backlog alimenta la planificación y el resultado es un incremento.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#222344"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><text x="450" y="32" text-anchor="middle" font-size="22" fill="#222344" font-weight="700">El Sprint de Scrum (1 mes o menos)</text><circle cx="450" cy="214" r="118" fill="#f4efdd" stroke="#cdad7d" stroke-width="4" stroke-dasharray="10 7"/><text x="450" y="208" text-anchor="middle" font-size="28" fill="#222344" font-weight="700">Sprint</text><text x="450" y="234" text-anchor="middle" font-size="15" fill="#222344" font-weight="400">Meta del Sprint</text><rect x="368" y="51" width="164" height="54" rx="8" fill="#cdad7d"/><text x="450.0" y="83" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Sprint Planning</text><rect x="528" y="187" width="164" height="54" rx="8" fill="#cdad7d"/><text x="610.0" y="210" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Daily Scrum</text><text x="610.0" y="229" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">(15 min)</text><rect x="368" y="323" width="164" height="54" rx="8" fill="#cdad7d"/><text x="450.0" y="355" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Sprint Review</text><rect x="208" y="187" width="164" height="54" rx="8" fill="#cdad7d"/><text x="290.0" y="210" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Sprint</text><text x="290.0" y="229" text-anchor="middle" font-size="15" fill="#222344" font-weight="700">Retrospective</text><text x="110" y="100" text-anchor="middle" font-size="16" fill="#222344" font-weight="700">Product Backlog</text><rect x="30" y="112" width="160" height="50" rx="8" fill="#e6d3a8"/><text x="110.0" y="134" text-anchor="middle" font-size="13" fill="#222344" font-weight="700">Lista ordenada</text><text x="110.0" y="150" text-anchor="middle" font-size="13" fill="#222344" font-weight="700">por el Product Owner</text><path d="M190 137 H250 L278 100" fill="none" stroke="#222344" stroke-width="2"/><path d="M278 100 L366 80" fill="none" stroke="#222344" stroke-width="2" marker-end="url(#a)"/><text x="790" y="322" text-anchor="middle" font-size="16" fill="#222344" font-weight="700">Incremento</text><rect x="715" y="336" width="150" height="46" rx="8" fill="#e6d3a8"/><text x="790.0" y="356" text-anchor="middle" font-size="14" fill="#222344" font-weight="700">Producto</text><text x="790.0" y="373" text-anchor="middle" font-size="14" fill="#222344" font-weight="700">utilizable</text><path d="M534 350 H712" fill="none" stroke="#222344" stroke-width="2" marker-end="url(#a)"/><text x="450" y="408" text-anchor="middle" font-size="14" fill="#222344" font-weight="400">Roles: Product Owner · Scrum Master · Developers</text></svg>